[package]
include = ["src/**", "assets/**", "examples/**", "tests/**", "testdata/**", "include/**", "web/**", "build.rs", "Cargo.toml", "README.md", "LICENSE*", "UPSTREAM.md", "THIRD_PARTY_LICENSES.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.py[cod]"]
name = "pdfoxium-cli"
version = "0.1.0"
edition.workspace = true
license = "BSD-3-Clause"
rust-version.workspace = true
repository.workspace = true
description = "Inspect, search, render and assemble PDFs using pdfoxium"

[[bin]]
name = "pdfoxium"
path = "src/main.rs"

[features]
default = ["simd", "xfa"]
simd = ["pdfoxium/simd"]
js = ["pdfoxium/js"]
xfa = ["js", "pdfoxium/xfa"]

[dependencies]
pdfoxium = { path = "../pdfoxium", version = "=0.1.0", default-features = false }
