[package]
include = ["src/**", "assets/**", "examples/**", "tests/**", "testdata/**", "include/**", "web/**", "build.rs", "Cargo.toml", "README.md", "LICENSE*", "UPSTREAM.md", "THIRD_PARTY_LICENSES.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.py[cod]"]
name = "pdfoxium-viewer"
version = "0.1.0"
edition.workspace = true
license = "BSD-3-Clause AND (MIT OR Apache-2.0)"
rust-version.workspace = true
repository.workspace = true
description = "Small egui/wgpu PDF viewer with optional local app control"

[dependencies]
pdfoxium = { path = "../pdfoxium", version = "=0.1.0" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
serde_json = "1.0.154"
png = "0.18.1"
# eframe's wgpu feature leaves backend selection to the application.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }
bytemuck = "1.25.2"
web-time = "1.1.0"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.10.3"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgl"] }
wasm-bindgen-spawn = "=0.0.7"
wasm_sync = "0.1.2"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Navigator", "Document", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Event", "console"] }
js-sys = "0.3.107"

[features]
web-test = []

[dev-dependencies]
pollster = "1.0.1"
